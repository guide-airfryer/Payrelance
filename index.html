<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PayRelance</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--tx:#10213f;--mu:#5b6b86;--pr:#0b2a5b;--pr2:#163f85;--bd:#dbe3f0;--ok:#157347;--okb:#e3f5ea;--wa:#9a6700;--wab:#fff4d6;--ko:#b42318;--kob:#fde8e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1226;--card:#111c38;--tx:#e8eefb;--mu:#9fb0cf;--pr:#5b8def;--pr2:#7aa2f7;--bd:#22325a;--okb:#12301f;--wab:#3a2e0b;--kob:#3b1714;--ok:#5fd08a;--wa:#f0c65a;--ko:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:70px}
header{background:#0b2a5b;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{font-size:18px}header small{opacity:.8}
main{max-width:900px;margin:0 auto;padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;padding:10px 2px;color:var(--mu);font-size:12px;cursor:pointer}
nav button.on{color:var(--pr);font-weight:700;box-shadow:inset 0 2px 0 var(--pr)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.k{font-size:12px;color:var(--mu)}.v{font-size:19px;font-weight:700;margin-top:2px}
h2{margin:6px 0 10px;font-size:18px}h3{margin:0 0 8px;font-size:15px}
button.b,a.b{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block}
button.s{background:var(--card);color:var(--pr);border:1px solid var(--bd)}button.d{background:var(--ko)}button.sm{padding:6px 10px;font-size:13px}
button:disabled{opacity:.5}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;margin:3px 0 10px}
label{font-size:13px;color:var(--mu)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.t-ok{background:var(--okb);color:var(--ok)}.t-wa{background:var(--wab);color:var(--wa)}.t-ko{background:var(--kob);color:var(--ko)}
.it{border-top:1px solid var(--bd);padding:10px 0}.it:first-child{border-top:0}
.late{border-left:4px solid var(--ko);padding-left:10px}
.mu{color:var(--mu);font-size:13px}.mod{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.mod>div{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:700px){.mod{align-items:center}.mod>div{border-radius:16px}}
.err{color:var(--ko);font-size:13px}
</style></head><body>
<div id="app"><main><p class="mu">Chargement…</p></main></div>
<script>
(function(){function show(t){var a=document.getElementById("app");if(a)a.innerHTML='<main style="padding:14px"><div style="background:#fff;border:1px solid #dbe3f0;border-radius:12px;padding:14px;color:#b42318"><b>Erreur technique</b><p style="word-break:break-word">'+String(t).replace(/</g,"&lt;")+'</p></div></main>'}
window.onerror=function(m,u,l,c){show(m+" (ligne "+l+")")};
window.addEventListener("unhandledrejection",function(e){show("Promesse : "+(e.reason&&(e.reason.message||e.reason)))});
setTimeout(function(){var a=document.getElementById("app");if(a&&a.textContent.indexOf("Chargement")>-1)show("Toujours en chargement apres 8 s. supabase="+typeof window.supabase)},8000)})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
const PLANS={starter:{n:"Starter",p:0,inv:10,ai:5,d:"10 factures en cours, 5 relances IA / mois"},pro:{n:"Pro",p:5000,inv:100,ai:100,d:"100 factures en cours, 100 relances IA / mois"},business:{n:"Business",p:15000,inv:1e9,ai:1e9,d:"Factures et relances IA illimitées"}};
const S={db:null,base:"",prof:null,clients:[],invs:[],rems:[],view:"dash",ready:false,filter:"all"};
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fc=n=>Number(n||0).toLocaleString("fr-FR")+" FCFA";
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fd=s=>s?s.split("-").reverse().join("/"):"";
const days=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
const status=i=>i.paid?"paid":(i.due<today()?"late":"open");
const toDb=(n,o)=>{const m={clientId:"client_id",paidOn:"paid_on",invoiceId:"invoice_id"},d={};for(const k in o){if(["clientName","created","at"].includes(k)||(n==="reminders"&&k==="num"))continue;d[m[k]||k]=o[k]}return d};
const chk=async p=>{const r=await p;if(r.error){alert("Erreur : "+r.error.message);throw r.error}await load()};
const col=n=>({add:o=>chk(sb.from(n).insert(toDb(n,o))),doc:id=>({update:o=>chk(sb.from(n).update(toDb(n,o)).eq("id",id)),delete:()=>chk(sb.from(n).delete().eq("id",id))})});
const plan=()=>PLANS[S.prof?.plan]||PLANS.starter;
const monthAI=()=>S.rems.filter(r=>(r.at||"").slice(0,7)===today().slice(0,7)).length;

const SB_URL="https://vlfeeefywrkjhetszhoo.supabase.co",SB_KEY="sb_publishable_0JWYRPNqdYXcGF3kiKBDDA_fp6_W5e7";
let sb;
async function init(){
  try{sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,lock:async(n,t,f)=>await f()}})}catch(e){return authView("Connexion au service impossible.")}
  let sess=null;
  try{const r=await Promise.race([sb.auth.getSession(),new Promise((_,j)=>setTimeout(()=>j(new Error("timeout")),6000))]);sess=r.data.session}catch(e){}
  if(!sess)return authView();
  S.uid=sess.user.id;await load();
}
async function load(){
  const [p,c,i,r,y]=await Promise.all([sb.from("profiles").select("*").eq("id",S.uid).maybeSingle(),sb.from("clients").select("*").order("created_at"),sb.from("invoices").select("*").order("created_at"),sb.from("reminders").select("*").order("created_at"),sb.from("payments").select("*").order("created_at")]);
  const e=p.error||c.error||i.error||r.error||y.error;
  if(e){$("#app").innerHTML='<main><div class="card err">Erreur : '+esc(e.message)+'</div></main>';return}
  S.prof=p.data;S.pays=y.data||[];S.clients=c.data.map(x=>({id:x.id,name:x.name,phone:x.phone,email:x.email}));
  const cn=id=>(S.clients.find(x=>x.id===id)||{}).name||"";
  S.invs=i.data.map(x=>({id:x.id,clientId:x.client_id,clientName:cn(x.client_id),num:x.num,amount:Number(x.amount),issued:x.issued,due:x.due,paid:x.paid,paidOn:x.paid_on}));
  S.rems=r.data.map(x=>{const v=S.invs.find(y=>y.id===x.invoice_id)||{};return{id:x.id,invoiceId:x.invoice_id,clientName:v.clientName||"",num:v.num||"",channel:x.channel,tone:x.tone,message:x.message,at:x.created_at}});
  S.ready=true;render();
}
function authView(msg,signup){
  $("#app").innerHTML=`<main><div class="card"><h2>PayRelance</h2><p class="mu">${signup?"Cr\u00e9er un compte":"Connexion"}</p><label>E-mail</label><input id="em" type="email" autocomplete="email"><label>Mot de passe (8 caract\u00e8res minimum)</label><input id="pw" type="password" autocomplete="${signup?"new-password":"current-password"}"><p id="e" class="err">${esc(msg||"")}</p><div class="row"><button class="b" onclick="auth(${!!signup})">${signup?"Cr\u00e9er mon compte":"Se connecter"}</button><button class="b s" onclick="authView('',${!signup})">${signup?"J'ai d\u00e9j\u00e0 un compte":"Cr\u00e9er un compte"}</button></div></div></main>`;
}
async function auth(signup){
  const email=$("#em").value.trim(),password=$("#pw").value;
  if(!email||password.length<8){$("#e").textContent="E-mail et mot de passe (8 caract\u00e8res minimum) requis.";return}
  const r=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
  if(r.error){$("#e").textContent=r.error.message;return}
  if(!r.data.session){authView("Compte cr\u00e9\u00e9. Confirmez votre e-mail avec le lien re\u00e7u, puis connectez-vous.");return}
  S.uid=r.data.session.user.id;await load();
}
const logout=async()=>{await sb.auth.signOut();S.prof=null;authView()};

function render(){
  if(!S.prof){return onboard()}
  const V={dash,inv:invoices,cli:clients,rel:relances,abo:abo}[S.view]();
  const tabs=[["dash","Tableau"],["inv","Factures"],["cli","Clients"],["rel","Relances"],["abo","Plan"]];
  $("#app").innerHTML=`<header><div><b>PayRelance</b><br><small>${esc(S.prof.company)}</small></div><span><span class="tag t-wa">${plan().n}</span> <button class="b sm s" onclick="logout()">Quitter</button></span></header><main>${V}</main><nav>${tabs.map(t=>`<button class="${S.view===t[0]?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("")}</nav>`;
}
const go=v=>{S.view=v;render();scrollTo(0,0)};

function onboard(){
  $("#app").innerHTML=`<main><div class="card"><h2>Bienvenue sur PayRelance</h2><p class="mu">Créez l'espace de votre entreprise. Vos données restent privées.</p>
  <label>Nom de l'entreprise</label><input id="co" placeholder="Ex : Ali Services"><label>Votre nom</label><input id="nm"><label>Téléphone (facultatif)</label><input id="ph" inputmode="tel">
  
  <p id="e" class="err"></p><button class="b" onclick="saveProf()">Créer mon espace</button></div></main>`;
}
async function saveProf(){
  const company=$("#co").value.trim();if(!company){$("#e").textContent="Indiquez le nom de l'entreprise.";return}
  const r=await sb.from("profiles").insert({id:S.uid,company,name:$("#nm").value.trim(),phone:$("#ph").value.trim()});
  if(r.error){$("#e").textContent=r.error.message;return}await load();
}

function dash(){
  const sum=a=>a.reduce((t,i)=>t+Number(i.amount),0);
  const p=S.invs.filter(i=>status(i)==="paid"),o=S.invs.filter(i=>status(i)==="open"),l=S.invs.filter(i=>status(i)==="late").sort((a,b)=>a.due<b.due?-1:1);
  return `<div class="grid"><div class="card"><div class="k">Payées</div><div class="v" style="color:var(--ok)">${fc(sum(p))}</div><div class="k">${p.length} facture(s)</div></div>
  <div class="card"><div class="k">En attente</div><div class="v">${fc(sum(o))}</div><div class="k">${o.length} facture(s)</div></div>
  <div class="card"><div class="k">En retard</div><div class="v" style="color:var(--ko)">${fc(sum(l))}</div><div class="k">${l.length} facture(s)</div></div>
  <div class="card"><div class="k">Relances envoyées</div><div class="v">${S.rems.length}</div></div></div>
  <div class="card"><h3>Factures en retard</h3>${l.length?l.map(i=>`<div class="it late"><div class="row sp"><b>${esc(i.clientName)}</b><b>${fc(i.amount)}</b></div><div class="mu">N° ${esc(i.num)} · retard de ${days(today(),i.due)} j</div><button class="b sm" style="margin-top:6px" onclick="relModal('${i.id}')">Préparer une relance</button></div>`).join(""):'<p class="mu">Aucune facture en retard. 👍</p>'}</div>
  ${S.invs.length?"":'<div class="card"><p>Commencez par <a href="#" onclick="go(\'cli\');return false">ajouter un client</a>, puis créez votre première facture.</p></div>'}`;
}

function invoices(){
  const f=S.filter,L=S.invs.filter(i=>f==="all"||status(i)===f).sort((a,b)=>a.due<b.due?-1:1);
  return `<div class="row sp"><h2>Factures</h2><button class="b" onclick="invModal()">+ Facture</button></div>
  <select onchange="S.filter=this.value;render()">${[["all","Toutes"],["open","En attente"],["late","En retard"],["paid","Payées"]].map(([k,t])=>`<option value="${k}" ${f===k?"selected":""}>${t}</option>`).join("")}</select>
  <div class="card">${L.length?L.map(i=>{const s=status(i);return `<div class="it ${s==="late"?"late":""}"><div class="row sp"><b>${esc(i.clientName)}</b><b>${fc(i.amount)}</b></div>
  <div class="row sp"><span class="mu">N° ${esc(i.num)} · échéance ${fd(i.due)}${(n=>n?" · "+n+" relance(s)":"")(S.rems.filter(r=>r.invoiceId===i.id).length)}</span><span class="tag ${s==="paid"?"t-ok":s==="late"?"t-ko":"t-wa"}">${s==="paid"?"Payée":s==="late"?"En retard "+days(today(),i.due)+" j":"En attente"}</span></div>
  <div class="row" style="margin-top:6px">${s==="paid"?"":`<button class="b sm" onclick="pay('${i.id}')">Marquer payée</button><button class="b sm s" onclick="relModal('${i.id}')">Relancer</button>`}<button class="b sm s" onclick="delInv('${i.id}')">Supprimer</button></div></div>`}).join(""):'<p class="mu">Aucune facture.</p>'}</div>`;
}
function invModal(){
  if(!S.clients.length){alert("Ajoutez d'abord un client.");return go("cli")}
  const act=S.invs.filter(i=>!i.paid).length;if(act>=plan().inv){alert("Limite de votre formule atteinte ("+plan().inv+" factures en cours). Passez à une formule supérieure.");return go("abo")}
  modal(`<h2>Nouvelle facture</h2><label>Client</label><select id="c">${S.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select>
  <label>N° de facture</label><input id="n" value="F-${String(S.invs.length+1).padStart(3,"0")}"><label>Montant (FCFA)</label><input id="a" type="number" inputmode="numeric" min="1">
  <label>Date d'émission</label><input id="i" type="date" value="${today()}"><label>Échéance</label><input id="d" type="date" value="${today()}"><p id="e" class="err"></p>
  <div class="row"><button class="b" onclick="saveInv()">Enregistrer</button><button class="b s" onclick="closeM()">Annuler</button></div>`);
}
async function saveInv(){
  const c=S.clients.find(x=>x.id===$("#c").value),a=Number($("#a").value),n=$("#n").value.trim(),d=$("#d").value,i=$("#i").value;
  if(!c||!(a>0)||!n||!d){$("#e").textContent="Remplissez tous les champs (montant > 0).";return}
  if(d<i){$("#e").textContent="L'échéance ne peut pas précéder l'émission.";return}
  closeM();await col("invoices").add({clientId:c.id,clientName:c.name,num:n,amount:a,issued:i,due:d,paid:false,created:new Date().toISOString()});
}
const pay=id=>col("invoices").doc(id).update({paid:true,paidOn:today()});
const delInv=id=>ask("Supprimer cette facture ?",()=>col("invoices").doc(id).delete());

function clients(){
  return `<div class="row sp"><h2>Clients</h2><button class="b" onclick="cliModal()">+ Client</button></div><div class="card">${S.clients.length?S.clients.map(c=>{const due=S.invs.filter(i=>i.clientId===c.id&&!i.paid).reduce((t,i)=>t+Number(i.amount),0);
  return `<div class="it"><div class="row sp"><b>${esc(c.name)}</b><span>${due?fc(due)+" dus":""}</span></div><div class="mu">${esc(c.phone||"")} ${esc(c.email||"")}</div><div class="row" style="margin-top:6px"><button class="b sm s" onclick="cliModal('${c.id}')">Modifier</button><button class="b sm s" onclick="delCli('${c.id}')">Supprimer</button></div></div>`}).join(""):'<p class="mu">Aucun client.</p>'}</div>`;
}
function cliModal(id){
  const c=S.clients.find(x=>x.id===id)||{};
  modal(`<h2>${id?"Modifier":"Nouveau"} client</h2><label>Nom</label><input id="n" value="${esc(c.name)}"><label>Téléphone / WhatsApp (avec indicatif, ex : 2250102030405)</label><input id="p" inputmode="tel" value="${esc(c.phone)}">
  <label>E-mail</label><input id="m" type="email" value="${esc(c.email)}"><p id="e" class="err"></p><div class="row"><button class="b" onclick="saveCli('${id||""}')">Enregistrer</button><button class="b s" onclick="closeM()">Annuler</button></div>`);
}
async function saveCli(id){
  const o={name:$("#n").value.trim(),phone:$("#p").value.trim(),email:$("#m").value.trim()};if(!o.name){$("#e").textContent="Le nom est obligatoire.";return}
  closeM();if(id)await col("clients").doc(id).update(o);else await col("clients").add({...o,created:new Date().toISOString()});
}
function delCli(id){if(S.invs.some(i=>i.clientId===id))return alert("Ce client a des factures : supprimez-les d'abord.");ask("Supprimer ce client ?",()=>col("clients").doc(id).delete())}

function relances(){
  return `<h2>Historique des relances</h2><div class="card">${S.rems.length?[...S.rems].sort((a,b)=>a.at<b.at?1:-1).map(r=>`<div class="it"><div class="row sp"><b>${esc(r.clientName)} · N° ${esc(r.num)}</b><span class="tag t-ok">${esc(r.channel)}</span></div><div class="mu">${new Date(r.at).toLocaleString("fr-FR")} · ton ${esc(r.tone)}</div><div style="white-space:pre-wrap;margin-top:4px">${esc(r.message)}</div></div>`).join(""):'<p class="mu">Aucune relance envoyée. Elles ne partent jamais sans votre validation.</p>'}</div>`;
}
function relModal(id){
  const i=S.invs.find(x=>x.id===id);if(!i)return;
  if(monthAI()>=plan().ai){alert("Limite mensuelle de relances IA atteinte pour la formule "+plan().n+".");return go("abo")}
  S.cur=i;
  modal(`<h2>Relance — ${esc(i.clientName)}</h2><p class="mu">N° ${esc(i.num)} · ${fc(i.amount)} · retard ${Math.max(0,days(today(),i.due))} j</p>
  <label>Ton</label><select id="t">${["courtois","ferme","dernier avis"].map((x,k)=>`<option ${k===((n=>n===0?0:(n>=2||days(today(),i.due)>30)?2:1)(S.rems.filter(r=>r.invoiceId===i.id).length))?"selected":""}>${x}</option>`).join("")}</select><label>Canal</label><select id="ch"><option>WhatsApp</option><option>E-mail</option><option>SMS</option></select>
  <button class="b s" id="gb" onclick="gen()">Générer le message</button><label style="display:block;margin-top:10px">Message (modifiable)</label><textarea id="msg" rows="7"></textarea><p id="e" class="err"></p>
  <div class="row"><button class="b" id="sb" onclick="send()">Valider et envoyer</button><button class="b s" onclick="closeM()">Annuler</button></div><p class="mu">Rien n'est envoyé tant que vous n'avez pas validé.</p>`);
}
async function gen(){
  const i=S.cur,t=$("#t").value,n=Math.max(0,days(today(),i.due)),sg=S.prof.name||S.prof.company;
  const o=t==="courtois"?"Nous esp\u00e9rons que vous allez bien. Sauf erreur de notre part, la facture":t==="ferme"?"Malgr\u00e9 notre pr\u00e9c\u00e9dent rappel, la facture":"Dernier avis avant d\u00e9marches de recouvrement : la facture";
  const f=t==="courtois"?"Si le paiement a d\u00e9j\u00e0 \u00e9t\u00e9 effectu\u00e9, merci d'ignorer ce message.":t==="ferme"?"Merci de proc\u00e9der au r\u00e8glement sous 48 heures ou de nous contacter pour convenir d'une solution.":"Sans r\u00e8glement sous 72 heures, nous serons contraints d'engager les d\u00e9marches n\u00e9cessaires.";
  $("#msg").value=`Bonjour ${i.clientName},\n\n${o} N\u00b0 ${i.num} d'un montant de ${fc(i.amount)}, \u00e9chue le ${fd(i.due)}, reste impay\u00e9e (${n} jour${n>1?"s":""} de retard).\n\n${f}\n\nCordialement,\n${sg}\n${S.prof.company}`;
  $("#gb").textContent="\u21bb R\u00e9g\u00e9n\u00e9rer";
}
async function send(){
  const i=S.cur,msg=$("#msg").value.trim(),ch=$("#ch").value;if(!msg){$("#e").textContent="Le message est vide.";return}
  const c=S.clients.find(x=>x.id===i.clientId)||{};let url="";const ph=(c.phone||"").replace(/\D/g,"");
  if(ch==="WhatsApp"){if(!ph){$("#e").textContent="Ajoutez le téléphone du client.";return}url="https://wa.me/"+ph+"?text="+encodeURIComponent(msg)}
  else if(ch==="SMS"){if(!ph){$("#e").textContent="Ajoutez le téléphone du client.";return}url="sms:+"+ph+"?body="+encodeURIComponent(msg)}
  else{if(!c.email){$("#e").textContent="Ajoutez l'e-mail du client.";return}url="mailto:"+c.email+"?subject="+encodeURIComponent("Facture "+i.num+" — rappel de paiement")+"&body="+encodeURIComponent(msg)}
  await col("reminders").add({invoiceId:i.id,clientName:i.clientName,num:i.num,channel:ch,tone:$("#t").value,message:msg,at:new Date().toISOString()});
  window.open(url,"_blank");closeM();go("rel");
}

function abo(){
  const cur=S.prof.plan;
  return `<h2>Abonnement</h2><p class="mu">Utilisation : ${S.invs.filter(i=>!i.paid).length} facture(s) en cours · ${monthAI()} relance(s) ce mois-ci.</p>${Object.entries(PLANS).map(([k,p])=>`<div class="card" style="${k===cur?"border:2px solid var(--pr)":""}"><div class="row sp"><h3>${p.n}</h3><b>${p.p?fc(p.p)+" / mois":"Gratuit"}</b></div><div class="mu">${p.d}</div>
  ${k===cur?'<span class="tag t-ok">Formule actuelle</span>':k==="starter"?"":`<button class="b sm" style="margin-top:8px" onclick="requestPlan('${k}')">Demander cette formule</button>`}</div>`).join("")}
  ${S.pays.length?'<h3>Mes demandes</h3><div class="card">'+S.pays.map(x=>'<div class="it"><b>'+esc((PLANS[x.plan]||{}).n||x.plan)+'</b> · '+esc(x.provider_ref||"")+' · <span class="tag '+(x.status==="pending"?"t-wa":"t-ok")+'">'+(x.status==="pending"?"En attente de vérification":"Traitée")+'</span></div>').join("")+'</div>':""}<p class="mu">Paiement par Wave ou Orange Money, activation après vérification. Tarifs indicatifs.</p>`;
}
const PAY_NUM="2250787585280",PAY_TXT="+225 07 87 58 52 80";
async function requestPlan(k){
  const pl=PLANS[k],ref="PR-"+Math.random().toString(36).slice(2,7).toUpperCase();
  const r=await sb.from("payments").insert({plan:k,amount:pl.p,provider:"manuel",provider_ref:ref});
  if(r.error){alert("Erreur : "+r.error.message);return}
  await load();
  const msg="Bonjour, j'ai payé "+fc(pl.p)+" pour la formule "+pl.n+" de PayRelance. Référence : "+ref+" ("+S.prof.company+").";
  modal(`<h2>Formule ${esc(pl.n)}</h2><p>1. Envoyez <b>${fc(pl.p)}</b> par Wave ou Orange Money au <b>${PAY_TXT}</b>.</p><p>2. Indiquez la référence <b>${ref}</b> dans le message du transfert.</p><p>3. Envoyez la preuve de paiement sur WhatsApp. Votre formule sera activée après vérification.</p><div class="row"><a class="b" target="_blank" href="https://wa.me/${PAY_NUM}?text=${encodeURIComponent(msg)}">Envoyer la preuve</a><button class="b s" onclick="closeM()">Fermer</button></div>`);
}

function modal(h){closeM();const d=document.createElement("div");d.className="mod";d.id="mod";d.innerHTML="<div>"+h+"</div>";d.onclick=e=>{if(e.target===d)closeM()};document.body.appendChild(d)}
function closeM(){$("#mod")?.remove()}
function ask(m,f){modal('<p>'+esc(m)+'</p><div class="row"><button class="b d" id="okb">Supprimer</button><button class="b s" onclick="closeM()">Annuler</button></div>');$("#okb").onclick=()=>{closeM();f()}}
window.alert=m=>modal('<p>'+esc(m)+'</p><button class="b" onclick="closeM()">OK</button>');
init();
</script></body></html>
